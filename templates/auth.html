<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Portal | Career Disha AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f1115; 
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #18181b;
            background-color: #09090b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-link:hover { color: #facc15; }
        .system-badge { font-size: 0.7rem; color: #3f3f46; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }

        .auth-container {
            max-width: 420px;
            width: 100%;
            margin: auto;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 2.5rem;
        }
        .icon-header {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #0f1115;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem auto;
        }
        h2 { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-align: center; margin-bottom: 0.5rem; }
        .form-desc { font-size: 0.85rem; color: #a1a1aa; text-align: center; margin-bottom: 2rem; }

        .input-group { margin-bottom: 1.25rem; }
        .hidden-field { display: none !important; }
        
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            background-color: #09090b;
            border: 1px solid #27272a;
            color: #ffffff;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #facc15; }
        
        .checkbox-container { display: flex; gap: 0.75rem; align-items: flex-start; margin: 1.5rem 0; }
        .checkbox-container input { margin-top: 0.2rem; accent-color: #facc15; }
        .checkbox-label { font-size: 0.75rem; color: #71717a; line-height: 1.4; }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #0f1115;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.95; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .form-footer { text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #27272a; font-size: 0.8rem; color: #71717a; }
        .form-footer span { color: #facc15; text-decoration: none; font-weight: 600; cursor: pointer; }
        .form-footer span:hover { text-decoration: underline; }

        footer { text-align: center; padding: 1.5rem; color: #3f3f46; font-size: 0.75rem; border-top: 1px solid #18181b; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="back-link">← Back to home platform</a>
        <span class="system-badge">Authentication Gateway</span>
    </header>

    <div class="auth-container">
        <div class="icon-header" id="portalIcon">👤</div>
        <h2 id="portalHeading">Create Your Account</h2>
        <p class="form-desc" id="portalDesc">Join Career Disha AI to permanently save your interactive progress indicators.</p>

        <form id="authForm">
            <!-- Full Name (Hidden during Login) -->
            <div class="input-group" id="nameFieldGroup">
                <label>Full Name</label>
                <input type="text" id="fullNameInput" name="full_name" placeholder="Enter full name" required>
            </div>

            <!-- Email Address -->
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" name="email" required placeholder="name@domain.com">
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="passwordInput" name="password" required placeholder="••••••••" minlength="6">
            </div>

            <!-- Terms Checkbox (Hidden during Login) -->
            <div class="checkbox-container" id="termsFieldGroup">
                <input type="checkbox" id="terms" checked required>
                <label for="terms" class="checkbox-label">I agree to allow the system to securely manage assessment calculations under data privacy laws.</label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Register & Begin Assessment</button>
        </form>

        <div class="form-footer">
            <span id="togglePromptText">Already possess an account?</span> 
            <span id="toggleModeLink" style="color: #facc15; cursor: pointer; font-weight: 600;">Sign In</span>
        </div>
    </div>

    <footer>
        &copy; 2026 Career Disha AI. All analytical processing parameters protected.
    </footer>

    <!-- INTERNAL FIREBASE CLIENT-SIDE SDK & AUTH LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFvSfjVahD4j73-Tec0r046piSDNUSjAc",
            authDomain: "career-smartcounselling.firebaseapp.com",
            projectId: "career-smartcounselling",
            storageBucket: "career-smartcounselling.firebasestorage.app",
            messagingSenderId: "1036367017854",
            appId: "1:1036367017854:web:2983d4b6c6f46edb64e52f",
            measurementId: "G-N7TV455JWM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentMode = "signup";

        const nameGroup = document.getElementById('nameFieldGroup');
        const nameInput = document.getElementById('fullNameInput');
        const termsGroup = document.getElementById('termsFieldGroup');
        const termsCheckbox = document.getElementById('terms');
        const heading = document.getElementById('portalHeading');
        const desc = document.getElementById('portalDesc');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleModeLink');
        const togglePromptText = document.getElementById('togglePromptText');
        const icon = document.getElementById('portalIcon');
        const authForm = document.getElementById('authForm');

        function updateUI() {
            if (currentMode === 'login') {
                nameGroup.classList.add('hidden-field');
                nameInput.removeAttribute('required');
                termsGroup.classList.add('hidden-field');
                termsCheckbox.removeAttribute('required');

                icon.innerText = "🔑";
                heading.innerText = "Welcome Back";
                desc.innerText = "Enter credentials securely to pipeline into active profile tracks.";
                submitBtn.innerText = "Sign In & Access Portal";
                togglePromptText.innerText = "New to Career Disha AI?";
                toggleLink.innerText = "Create Account";
            } else {
                nameGroup.classList.remove('hidden-field');
                nameInput.setAttribute('required', 'true');
                termsGroup.classList.remove('hidden-field');
                termsCheckbox.setAttribute('required', 'true');

                icon.innerText = "👤";
                heading.innerText = "Create Your Account";
                desc.innerText = "Join Career Disha AI to permanently save your interactive progress indicators.";
                submitBtn.innerText = "Register & Begin Assessment";
                togglePromptText.innerText = "Already possess an account?";
                toggleLink.innerText = "Sign In";
            }
        }

        // Single stable click listener to prevent toggling loops
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            currentMode = currentMode === 'signup' ? 'login' : 'signup';
            updateUI();
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'login') {
            currentMode = 'login';
        }
        updateUI();

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const fullName = document.getElementById('fullNameInput').value.trim() || "Student";

            try {
                let user;
                if (currentMode === 'signup') {
                    submitBtn.innerText = "Creating Profile...";
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    user = cred.user;

                    // Register user document into Cloud Firestore
                    await setDoc(doc(db, "users", user.uid), {
                        full_name: fullName,
                        email: user.email,
                        stream: "General",
                        academicLevel: "Standard Track",
                        testCompleted: false,
                        createdAt: new Date().toISOString()
                    });
                } else {
                    submitBtn.innerText = "Authenticating...";
                    const cred = await signInWithEmailAndPassword(auth, email, password);
                    user = cred.user;
                }

                // CRITICAL: Get Firebase ID token and send to Flask to establish session
                const idToken = await user.getIdToken();
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });

                const result = await response.json();
                if (response.ok && result.status === "success") {
                    // Redirect to dashboard (or change to /user/test if they need to take the test first)
                    window.location.href = "/user/dashboard";
                } else {
                    throw new Error(result.message || "Session establishment failed.");
                }

            } catch (err) {
                console.error("Auth Exception:", err);
                alert(err.message || "Authentication error occurred.");
                submitBtn.disabled = false;
                submitBtn.innerText = currentMode === 'signup' ? "Register & Begin Assessment" : "Sign In & Access Portal";
            }
        });
    </script>
</body>
</html>
