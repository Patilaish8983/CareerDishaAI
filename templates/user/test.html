<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychometric Assessment | Career Disha AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f1115; color: #f4f4f5; line-height: 1.6; }
        .yellow-text { color: #facc15; }
        
        /* Fixed Navbar Styling */
        nav { 
            background-color: rgba(9, 9, 11, 0.95); 
            border-bottom: 1px solid #27272a; 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .logo-box { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; color: #0f1115; background-color: #facc15; }
        .brand-name { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-left: 0.75rem; }
        .nav-brand-container { display: flex; align-items: center; text-decoration: none; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: #a1a1aa; text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #facc15; font-weight: 600; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; color: #a1a1aa; font-size: 0.88rem; }
        .logout-btn { padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; background-color: #27272a; color: #ffffff; text-decoration: none; border: 1px solid #3f3f46; cursor: pointer; }
        .logout-btn:hover { background-color: #3f3f46; }

        main { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }
        .quiz-card { background-color: #18181b; border: 1px solid #27272a; border-radius: 20px; padding: 2.5rem; }
        .progress-bar { width: 100%; height: 8px; background-color: #27272a; border-radius: 4px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #facc15; width: 0%; transition: width 0.3s ease; }
        .question-title { font-size: 1.25rem; font-weight: 700; color: #ffffff; margin-bottom: 1.5rem; }
        .option-btn { width: 100%; text-align: left; background-color: #09090b; border: 1px solid #27272a; color: #e4e4e7; padding: 1rem 1.25rem; border-radius: 12px; margin-bottom: 0.85rem; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; font-family: inherit; }
        .option-btn:hover { border-color: #facc15; background-color: rgba(250, 204, 21, 0.05); }
    </style>
</head>
<body>

    <nav id="user-nav"></nav>

    <main>
        <div class="quiz-card">
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <span style="font-size: 0.8rem; color: #facc15; font-weight: 700; text-transform: uppercase;">Question <span id="q-num">1</span> of <span id="q-total">5</span></span>
            <div class="question-title" id="q-text">Loading assessment...</div>
            <div id="options-container"></div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='user.js') }}"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFvSfjVahD4j73-Tec0r046piSDNUSjAc",
            authDomain: "career-smartcounselling.firebaseapp.com",
            projectId: "career-smartcounselling",
            storageBucket: "career-smartcounselling.firebasestorage.app",
            messagingSenderId: "1036367017854",
            appId: "1:1036367017854:web:2983d4b6c6f46edb64e52f",
            measurementId: "G-N7TV455JWM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.firebaseAuth = auth;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    let fullName = "User";
                    if (docSnap.exists() && docSnap.data().full_name) {
                        fullName = docSnap.data().full_name;
                    } else if (user.displayName) {
                        fullName = user.displayName;
                    }
                    const navEl = document.getElementById('nav-user-first-name');
                    if (navEl) navEl.textContent = fullName.split(' ')[0];
                } catch (err) {
                    console.error("Profile load error:", err);
                }
            } else {
                window.location.href = "/auth";
            }
        });
    </script>

    <script>
        // Default Fallback Questions if Firestore is Empty
        const defaultQuestions = [
            {
                q: "What kind of projects or tasks do you enjoy doing the most?",
                options: [
                    { text: "Building software, writing code, or working with apps & tech", traits: { "I": 0.9, "R": 0.3 } },
                    { text: "Learning about biology, healthcare, or helping people stay fit", traits: { "S": 0.8, "I": 0.5 } },
                    { text: "Managing money, planning business ideas, or startup budgeting", traits: { "E": 0.9, "C": 0.4 } },
                    { text: "Designing graphics, video editing, or creative UI/UX styling", traits: { "A": 1.0, "E": 0.2 } },
                    { text: "Studying laws, public rules, or government administration", traits: { "C": 0.8, "E": 0.6 } }
                ]
            },
            {
                q: "If you had a free weekend workshop, which topic would you pick?",
                options: [
                    { text: "Stock market investing and business pitching", traits: { "E": 0.9, "C": 0.5 } },
                    { text: "Public speaking, debate, or civil services preparation", traits: { "C": 0.9, "E": 0.5 } },
                    { text: "Web development & building AI tools", traits: { "I": 0.9, "R": 0.4 } },
                    { text: "Graphic design, content creation, or digital art", traits: { "A": 1.0, "E": 0.3 } },
                    { text: "Basic medical science, first aid, or health innovation", traits: { "S": 0.8, "I": 0.6 } }
                ]
            },
            {
                q: "How do you usually solve a difficult problem?",
                options: [
                    { text: "By running tests, checking medical or scientific data", traits: { "I": 0.8, "S": 0.7 } },
                    { text: "By brainstorming creative, visual, and out-of-the-box ideas", traits: { "A": 1.0, "I": 0.2 } },
                    { text: "By breaking it down with logic, coding, or systematic debugging", traits: { "I": 1.0, "R": 0.3 } },
                    { text: "By following official guidelines, documentation, and proper rules", traits: { "C": 0.9, "S": 0.5 } },
                    { text: "By looking at costs, risks, and practical profits", traits: { "E": 0.9, "C": 0.6 } }
                ]
            },
            {
                q: "What kind of work environment do you picture yourself working in?",
                options: [
                    { text: "A corporate office, startup hub, or business boardroom", traits: { "E": 1.0, "C": 0.5 } },
                    { text: "A tech lab, software company, or coding studio", traits: { "I": 0.9, "R": 0.4 } },
                    { text: "A hospital, research center, or healthcare clinic", traits: { "S": 0.9, "I": 0.5 } },
                    { text: "A government office, court, or policy council", traits: { "C": 0.9, "E": 0.6 } },
                    { text: "A design agency, art studio, or creative workspace", traits: { "A": 1.0, "E": 0.3 } }
                ]
            },
            {
                q: "What ultimate goal do you want to achieve in your career?",
                options: [
                    { text: "Design creative media or apps that inspire people", traits: { "A": 1.0, "E": 0.3 } },
                    { text: "Discover health breakthroughs and save lives", traits: { "S": 1.0, "I": 0.4 } },
                    { text: "Make rules fairer and improve public infrastructure", traits: { "C": 0.9, "S": 0.7 } },
                    { text: "Launch a successful business or lead a major company", traits: { "E": 1.0, "C": 0.4 } },
                    { text: "Build powerful software used by millions worldwide", traits: { "I": 0.9, "R": 0.4 } }
                ]
            }
        ];

        let selectedQuestions = [];
        let currentQ = 0;
        let userAnswersTraits = [];

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof renderUserNavbar === 'function') {
                renderUserNavbar('test');
            }

            // Try fetching live questions from Flask / Firestore
            try {
                const res = await fetch('/api/admin/questions');
                const data = await res.json();
                if (data.status === 'success' && data.questions && data.questions.length >= 3) {
                    // Map questions to standard format
                    const formattedQuestions = data.questions.map(item => ({
                        q: item.q || item.prompt,
                        options: item.options || []
                    }));
                    selectedQuestions = shuffleArray(formattedQuestions).slice(0, 5);
                } else {
                    // Fallback to local default questions if DB is empty
                    selectedQuestions = shuffleArray(defaultQuestions).slice(0, 5);
                }
            } catch (e) {
                console.warn("Using fallback question bank:", e);
                selectedQuestions = shuffleArray(defaultQuestions).slice(0, 5);
            }

            const totalEl = document.getElementById('q-total');
            if (totalEl) totalEl.textContent = selectedQuestions.length;
            loadQuestion();
        });

        function loadQuestion() {
            const q = selectedQuestions[currentQ];
            document.getElementById('q-num').textContent = currentQ + 1;
            document.getElementById('q-text').textContent = q.q;
            document.getElementById('progress').style.width = `${((currentQ + 1) / selectedQuestions.length) * 100}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const randomizedOptions = shuffleArray(q.options);

            randomizedOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text || opt.description || opt;
                
                // Map option domain tags to trait vectors if not explicitly given
                const optionTraits = opt.traits || getTraitFromDomain(opt.domain || opt.tag);
                
                btn.onclick = () => selectOption(optionTraits);
                container.appendChild(btn);
            });
        }

        // Helper mapping if questions come from admin panel dropdown tags
        function getTraitFromDomain(domain) {
            const domainMap = {
                "Tech & Software": { "I": 0.9, "R": 0.4 },
                "Medical & Life Sciences": { "S": 0.9, "I": 0.5 },
                "Finance & Management": { "E": 0.9, "C": 0.6 },
                "Creative Arts & Design": { "A": 1.0, "E": 0.2 },
                "Law & Civil Services": { "C": 0.9, "S": 0.6 },
                "Chartered Accountancy": { "C": 1.0, "E": 0.7 },
                "Scientific Research": { "I": 1.0, "R": 0.5 }
            };
            return domainMap[domain] || { "I": 0.5, "E": 0.5 };
        }

        function selectOption(traits) {
            userAnswersTraits.push(traits);
            currentQ++;
            if (currentQ < selectedQuestions.length) {
                loadQuestion();
            } else {
                finishTest();
            }
        }

        async function finishTest() {
            try {
                let headers = { 'Content-Type': 'application/json' };
                const authObj = window.firebaseAuth;
                if (authObj && authObj.currentUser) {
                    const token = await authObj.currentUser.getIdToken();
                    headers['Authorization'] = 'Bearer ' + token;
                }

                const response = await fetch('/api/quiz/submit', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ answers_traits: userAnswersTraits })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    window.location.href = data.redirect || '/user/results';
                } else {
                    console.error("Submission failed:", data.message);
                    window.location.href = '/user/results';
                }
            } catch (err) {
                console.error("Error submitting test:", err);
                window.location.href = '/user/results';
            }
        }
    </script>
</body>
</html>
